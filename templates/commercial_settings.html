{% extends 'base.html' %}{% block page_title %}Commercial Settings{% endblock %}{% block page_subtitle %}Mothers Harvest Suppliers{% endblock %}
{% block content %}<section class="panel narrow-card"><h2>Ready-for-processing moisture thresholds</h2><p class="panel-note">Coffee at or above the threshold is routed to drying.</p><form method="post" class="stacked-form"><label>DRUGAR FAQ threshold (%)<input type="number" step="0.1" name="drugar_dry_threshold" value="{{row.drugar_dry_threshold}}" required></label><label>Dry Parchment threshold (%)<input type="number" step="0.1" name="parchment_dry_threshold" value="{{row.parchment_dry_threshold}}" required></label><button>Save settings</button></form></section>{% endblock %}
