{% extends "base.html" %}
{% block title %}Edit supplier · Stancoff{% endblock %}
{% block page_title %}Edit supplier{% endblock %}
{% block page_subtitle %}Correct supplier details without affecting purchase history{% endblock %}
{% block content %}
<section class="panel">
  <form method="post" class="form">
    <label>Supplier code<input name="code" value="{{row.code}}" required></label>
    <label>Supplier name<input name="name" value="{{row.name}}" required></label>
    <label>Phone<input name="phone" value="{{row.phone or ''}}"></label>
    <label>Location<input name="location" value="{{row.location or ''}}"></label>
    <label>Status<select name="status"><option {% if row.status=='Active' %}selected{% endif %}>Active</option><option {% if row.status=='Inactive' %}selected{% endif %}>Inactive</option></select></label>
    <div class="form-wide">
      <button>Save changes</button>
      <a class="secondary-button" href="/suppliers">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
