{% extends "base.html" %}{% block page_title %}Edit MHS Drying{% endblock %}{% block page_subtitle %}{{row.drying_no}} · {{row.lot.lot_no}}{% endblock %}{% block content %}
<div class="section-card"><form method="post" class="mhs-form-grid">
<label>Start date<input type="date" name="start_date" value="{{row.start_date.isoformat()}}" required></label>
<label>Input weight kg<input type="number" step="0.01" min="0.01" name="input_weight" value="{{row.input_weight}}" required></label>
<label>Start moisture %<input type="number" step="0.01" name="start_moisture" value="{{row.start_moisture if row.start_moisture is not none else ''}}"></label>
<label>Location<input name="location" value="{{row.location or ''}}"></label><label>Supervisor<input name="supervisor" value="{{row.supervisor or ''}}"></label>
<label class="mhs-span-all">Notes<textarea name="notes">{{row.notes or ''}}</textarea></label>
<div class="mhs-span-all"><button class="button">Save changes</button> <a class="button secondary" href="{{url_for('mhs_drying')}}">Cancel</a></div></form></div>{% endblock %}
