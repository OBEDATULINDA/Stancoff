{% extends 'base.html' %}{% block page_title %}Edit Commercial Supplier{% endblock %}{% block page_subtitle %}Mothers Harvest Suppliers{% endblock %}{% block content %}
<section class="panel"><div class="panel-heading"><div><span class="eyebrow">Supplier register</span><h2>{{row.code}}</h2></div><span class="panel-note">Supplier codes are permanent and remain automatically generated.</span></div><form method="post" class="form"><label>Supplier code<input value="{{row.code}}" readonly></label><label>Supplier name<input name="name" value="{{row.name}}" required></label><label>Phone<input name="phone" value="{{row.phone or ''}}"></label><label>Location<input name="location" value="{{row.location or ''}}"></label><label>Status<select name="status"><option {% if row.status=='Active' %}selected{% endif %}>Active</option><option {% if row.status=='Inactive' %}selected{% endif %}>Inactive</option></select></label><button>Save changes</button><a class="small-button" href="{{url_for('commercial_suppliers')}}">Cancel</a></form></section>{% endblock %}
